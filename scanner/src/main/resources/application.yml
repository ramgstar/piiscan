# scanner는 서버가 아니라 run당 짧게 실행되는 CLI(배치)입니다.
# 프로필 선택: --spring.profiles.active=prod (기본은 dev)
spring:
  application:
    name: piiscan-scanner
  profiles:
    active: dev
  main:
    web-application-type: none
    banner-mode: "off"

# 로깅은 logback-spring.xml이 담당한다(파일 전용 → stdout은 PROGRESS=/FILE=/SUMMARY= 마커 채널로
# 보호). 레벨만 여기서 프로필별로 조정한다.
logging:
  level:
    root: INFO

piiscan:
  log-path: piiScanner/logs

---
# dev: 로컬/IDE 실행. 진단을 위해 우리 코드는 DEBUG.
spring:
  config:
    activate:
      on-profile: dev
logging:
  level:
    root: INFO
    com.piiscan: DEBUG

---
# prod: 배포(zip) 실행. 프레임워크 로그 최소화, 우리 코드는 INFO.
# 배포 레이아웃에서는 엔진 바이너리가 anlys/ 에 위치한다(Windows는 .exe 자동 폴백).
spring:
  config:
    activate:
      on-profile: prod
logging:
  level:
    root: WARN
    com.piiscan: INFO
piiscan:
  engine-path: anlys/piiscan-engine

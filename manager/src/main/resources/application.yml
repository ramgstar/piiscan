# 공통 설정. 아래 프로필별 문서(--- 구분)가 이 값을 덮어씁니다.
# 프로필 선택: java -jar ... --spring.profiles.active=prod (기본은 dev)
spring:
  application:
    name: piiscan-manager
  profiles:
    active: dev

server:
  port: 5050

piiscan:
  # manager가 analyzer를 실행하고 엔진을 찾을 때 쓰는 경로.
  # 상대 경로는 manager 작업 디렉토리 기준 → 저장소 루트에서 실행 권장.
  java-bin: java
  engine-path: engine/target/release/piiscan-engine
  analyzer-jar: analyzer/target/piiscan-analyzer.jar
  patterns-path: samples/patterns.json

---
# dev: 로컬 개발용. 템플릿 캐시 끔, 상세 로그.
spring:
  config:
    activate:
      on-profile: dev
  thymeleaf:
    cache: false

logging:
  level:
    root: INFO
    com.piiscan: DEBUG

---
# prod: 배포용. 템플릿 캐시 켬, 로그 최소화, 포트는 환경변수 PORT(기본 8080).
spring:
  config:
    activate:
      on-profile: prod
  thymeleaf:
    cache: true

server:
  port: ${PORT:8080}

logging:
  level:
    root: WARN
    com.piiscan: INFO

# 공통 설정. 아래 프로필별 문서(--- 구분)가 이 값을 덮어씁니다.
# 프로필 선택: java -jar ... --spring.profiles.active=prod (기본은 dev)
#
# 실행 위치: manager는 저장소 루트에서 실행하세요. 그래야 자식 프로세스로 뜨는 scanner가
# 자신의 config로 scanFiles/engine/patterns를 상대 경로로 찾습니다.
spring:
  application:
    name: piiscan-manager
  profiles:
    active: dev

server:
  port: 5050

piiscan:
  # manager가 자식 프로세스로 실행할 scanner jar 경로(저장소 루트 기준 상대 경로).
  scanner-jar: scanner/target/piiscan-scanner.jar
  # scanner 실행에 사용할 java 실행 파일.
  java-bin: java
  schedule:
    # 스캔 스케줄 간격(ms). 직전 실행이 끝난 뒤부터 이 시간만큼 지나면 다음 실행을 시도합니다
    # (fixedDelay). RunState 가드가 겹치는 실행을 막습니다. 스케줄을 사실상 끄려면 아주 큰
    # 값(예: 3153600000000 ≈ 100년)으로 설정하세요.
    fixed-delay: 60000

---
# dev: 로컬 개발용. 템플릿 캐시 끔, 상세 로그.
spring:
  config:
    activate:
      on-profile: dev
  thymeleaf:
    cache: false

logging:
  level:
    root: INFO
    com.piiscan: DEBUG

---
# prod: 배포용. 템플릿 캐시 켬, 로그 최소화, 포트는 환경변수 PORT(기본 8080).
spring:
  config:
    activate:
      on-profile: prod
  thymeleaf:
    cache: true

server:
  port: ${PORT:8080}

logging:
  level:
    root: WARN
    com.piiscan: INFO

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('engine/Cargo.lock') }}

      # Build the native engine first: the analyzer's end-to-end test drives it.
      - name: Build engine (release)
        run: cargo build --release --manifest-path engine/Cargo.toml

      - name: Test engine
        run: cargo test --manifest-path engine/Cargo.toml

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Reactor build: compiles and tests analyzer, manager and source-tester.
      # The analyzer's e2e test uses the engine binary built above.
      - name: Build and test (all modules)
        run: mvn -B verify
